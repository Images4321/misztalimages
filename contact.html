<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Contact | Misztal Images</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Shared Styles -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body class="bg-[#F0F5F9] text-[#1E2022]">

  <!-- NAVBAR -->
  <header
    class="fixed top-0 left-0 w-full z-50 nav-blur border-b border-[#C9D6DF]"
  >
    <nav class="container-width px-6 py-4">

      <div class="flex justify-between items-center">

        <a
          href="index.html"
          class="font-semibold text-2xl"
        >
          Misztal Images
        </a>

        <!-- Desktop Navigation -->
        <div class="hidden md:flex gap-8 text-sm">
          <a href="gallery.html">Gallery</a>
          <a href="collections.html">Collections</a>
          <a href="story.html">Story</a>

          <a
            href="contact.html"
            class="text-[#52616B] font-medium"
          >
            Contact
          </a>
        </div>

        <!-- Mobile Menu Button -->
        <button
          id="menuBtn"
          class="md:hidden text-2xl"
        >
          ☰
        </button>
      </div>

      <!-- Mobile Menu -->
      <div
        id="mobileMenu"
        class="mobile-menu md:hidden pt-4 flex flex-col gap-4"
      >
        <a href="gallery.html">Gallery</a>
        <a href="collections.html">Collections</a>
        <a href="story.html">Story</a>
        <a href="contact.html">Contact</a>
      </div>

    </nav>
  </header>

  <main class="pt-32 min-h-screen">

    <!-- CONTACT SECTION -->
    <section class="section-padding fade-in">
      <div
        class="container-width max-w-3xl text-center"
      >

        <p
          class="uppercase tracking-[0.3em] text-sm text-[#52616B] mb-5"
        >
          Get In Touch
        </p>

        <h1
          class="text-5xl md:text-7xl font-light mb-8"
        >
          Let’s Connect
        </h1>

        <p
          class="text-lg text-[#52616B] leading-relaxed mb-12"
        >
          For any general enquiries,
          please feel free to get in touch.
        </p>

        <!-- EMAIL CARD -->
        <div
          class="bg-white rounded-[2rem] p-10 shadow-sm inline-block"
        >
          <p
            class="uppercase text-xs tracking-[0.2em] text-[#52616B] mb-4"
          >
            Email
          </p>

          <a
            href="mailto:hello@misztalimages.com"
            class="text-2xl md:text-3xl font-light hover:opacity-70 transition"
          >
            hello@misztalimages.com
          </a>

          <p
            class="text-sm text-[#52616B] mt-5"
          >
            Response time usually within 1–2 days
          </p>
        </div>

      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer
    class="bg-[#1E2022] text-[#F0F5F9] py-16"
  >
    <div class="container-width px-6 text-center">
      <p class="text-sm text-gray-300">
        Misztal Images
      </p>
    </div>
  </footer>

  <!-- Back To Top -->
  <button
    id="backToTop"
    class="bg-[#52616B] text-white px-4 py-3 rounded-full"
  >
    ↑
  </button>

  <!-- Scripts -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/animations.js"></script>

</body>
</html>
