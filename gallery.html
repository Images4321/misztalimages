<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Gallery | Misztal Images</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Shared CSS -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>

  <!-- NAVBAR -->
  <header
    class="fixed top-0 left-0 w-full z-50 nav-blur border-b border-[#C9D6DF]"
  >
    <nav class="container-width px-6 py-4">

      <div class="flex justify-between items-center">

        <a
          href="index.html"
          class="text-2xl font-semibold"
        >
          Misztal Images
        </a>

        <!-- Desktop Navigation -->
       <div class="hidden md:flex gap-8 text-sm">
  <a href="gallery.html">Gallery</a>
  <a href="collections.html">Collections</a>
  <a href="story.html">Story</a>
  <a href="contact.html">Contact</a>
       </div>

        <!-- Mobile Menu Button -->
        <button
          id="menuBtn"
          class="md:hidden text-2xl"
        >
          ☰
        </button>
      </div>

      <!-- Mobile Menu -->
      <div
  id="mobileMenu"
  class="mobile-menu md:hidden pt-4 flex flex-col gap-4"
>
  <a href="gallery.html">Gallery</a>
  <a href="collections.html">Collections</a>
  <a href="story.html">Story</a>
  <a href="contact.html">Contact</a>
</div>

    </nav>
  </header>

  <main class="pt-28">

    <!-- PAGE HEADER -->
    <section
      class="text-center px-6 mb-16 fade-in"
    >
      <h1 class="text-5xl font-light mb-5">
        Gallery
      </h1>

      <p class="max-w-2xl mx-auto text-[#52616B]">
        A growing archive of portraits, landscapes,
        travel moments and quiet stories captured
        along the way.
      </p>
    </section>

  <!-- IMAGE GRID -->
<section class="section-padding pt-0">
  <div
    class="container-width grid sm:grid-cols-2 lg:grid-cols-3 gap-8"
  >

    <img
      src="assets/images/gallery/01.jpeg"
      alt="Photography"
      class="rounded-[2rem] object-cover shadow-sm card-hover gallery-image lightbox-trigger cursor-pointer fade-in"
    />

    <img
      src="assets/images/gallery/02.jpeg"
      alt="Photography"
      class="rounded-[2rem] object-cover shadow-sm card-hover gallery-image lightbox-trigger cursor-pointer fade-in"
    />

    <img
      src="assets/images/gallery/03.jpeg"
      alt="Photography"
      class="rounded-[2rem] object-cover shadow-sm card-hover gallery-image lightbox-trigger cursor-pointer fade-in"
    />

    <img
      src="assets/images/gallery/04.jpeg"
      alt="Photography"
      class="rounded-[2rem] object-cover shadow-sm card-hover gallery-image lightbox-trigger cursor-pointer fade-in"
    />

    <img
      src="assets/images/gallery/05.jpeg"
      alt="Photography"
      class="rounded-[2rem] object-cover shadow-sm card-hover gallery-image lightbox-trigger cursor-pointer fade-in"
    />

    <img
      src="assets/images/gallery/06.jpeg"
      alt="Photography"
      class="rounded-[2rem] object-cover shadow-sm card-hover gallery-image lightbox-trigger cursor-pointer fade-in"
    />

   <img
      src="assets/images/gallery/07.jpeg"
      alt="Photography"
      class="rounded-[2rem] object-cover shadow-sm card-hover gallery-image lightbox-trigger cursor-pointer fade-in"
    />

    <img
      src="assets/images/gallery/08.jpeg"
      alt="Photography"
      class="rounded-[2rem] object-cover shadow-sm card-hover gallery-image lightbox-trigger cursor-pointer fade-in"
    />

  </div>
</section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-[#1E2022] text-[#F0F5F9] py-16">
    <div class="container-width px-6 text-center">
      <p class="text-sm text-gray-300">
        Misztal Images
      </p>
    </div>
  </footer>

  <!-- Back To Top -->
  <button
    id="backToTop"
    class="bg-[#52616B] text-white px-4 py-3 rounded-full"
  >
    ↑
  </button>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <img id="lightboxImage" alt="Expanded view" />
  </div>

  <!-- Scripts -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/lightbox.js"></script>

</body>
</html>
